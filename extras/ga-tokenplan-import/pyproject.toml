[project]
name = "ga-tokenplan-import"
version = "1.0.0"
description = "Optional GenericAgent plugin: import TokenPlan keys via 127.0.0.1:34134"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
ga-tokenplan-import = "ga_tokenplan_import.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ga_tokenplan_import"]
